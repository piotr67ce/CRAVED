<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CRAVED – Ocena zachowań wobec żywności wysoko przetworzonej (UPF)</title>
    <style>
        :root {
            --bg-page: #f5f5f0;
            --bg-card: #ffffff;
            --bg-soft: #f7f8f5;
            --ink-main: #33322e;
            --ink-muted: #5f635c;
            --border-subtle: #e2e4dc;
            --accent: #2e6f40;
            --accent-hover: #235731;
            --accent-soft: #edf5ef;
            --warn: #b26a00;
            --warn-soft: #fdf5e6;
            --alert: #b83227;
            --alert-soft: #fceceb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            color: var(--ink-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.55;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-shell {
            width: 100%;
            max-width: 640px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(51, 50, 46, 0.07);
            overflow: hidden;
        }

        .hero {
            background: linear-gradient(135deg, #245733 0%, #347848 100%);
            color: #ffffff;
            padding: 24px 28px;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .hero-icon {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-brand {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.85;
            margin-bottom: 4px;
        }

        .hero h1 {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 4px;
        }

        .hero p {
            font-size: 0.9rem;
            opacity: 0.92;
        }

        .content {
            padding: 28px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: reveal 0.28s ease-out;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .intro-lead {
            font-size: 1rem;
            color: var(--ink-main);
            margin-bottom: 14px;
        }

        .intro-sub {
            font-size: 0.93rem;
            color: var(--ink-muted);
            margin-bottom: 22px;
        }

        .info-strip {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .info-pill {
            background: var(--bg-soft);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px 10px;
            text-align: center;
        }

        .info-pill strong {
            display: block;
            font-size: 0.95rem;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .info-pill span {
            font-size: 0.78rem;
            color: var(--ink-muted);
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.84rem;
            color: var(--ink-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: var(--bg-soft);
            border: 1px solid var(--border-subtle);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 22px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.28s ease;
        }

        .question-card {
            background: var(--bg-soft);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question-tag {
            display: inline-block;
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.08rem;
            font-weight: 600;
            color: var(--ink-main);
            line-height: 1.5;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .btn-answer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 18px 14px;
            border-radius: 14px;
            border: 2px solid var(--border-subtle);
            background: #ffffff;
            cursor: pointer;
            transition: all 0.18s ease;
            font-family: inherit;
        }

        .btn-answer .ans-label {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .btn-answer .ans-pts {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .btn-answer.yes {
            color: var(--alert);
            border-color: #f0c9c6;
        }

        .btn-answer.yes:hover {
            background: var(--alert-soft);
            border-color: var(--alert);
            transform: translateY(-1px);
        }

        .btn-answer.no {
            color: var(--accent);
            border-color: #c5decb;
        }

        .btn-answer.no:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .btn-back {
            background: transparent;
            border: none;
            color: var(--ink-muted);
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 2px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back:hover:not(:disabled) {
            color: var(--ink-main);
        }

        .btn-back:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .summary-top {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--bg-soft);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .ring-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            flex-shrink: 0;
        }

        .ring-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--ink-main);
            line-height: 1.1;
        }

        .ring-center span {
            font-size: 1.35rem;
        }

        .ring-center small {
            font-size: 0.75rem;
            color: var(--ink-muted);
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            font-size: 0.76rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 6px;
        }

        .badge-low {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .badge-mid {
            background: var(--warn-soft);
            color: var(--warn);
        }

        .badge-high {
            background: var(--alert-soft);
