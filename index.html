<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CRAVED – Oktawian Przeliorz Dietetyk</title>
    <style>
        :root {
            --bg-page: #f5f5f0;
            --bg-card: #ffffff;
            --bg-soft: #f7f8f5;
            --ink-main: #33322e;
            --ink-muted: #5f635c;
            --border-subtle: #e2e4dc;
            --accent: #4c8c2b;
            --accent-deep: #2e6f40;
            --accent-hover: #235731;
            --accent-soft: #edf5ef;
            --warn: #b26a00;
            --warn-soft: #fdf5e6;
            --alert: #b83227;
            --alert-soft: #fceceb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            color: var(--ink-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px;
        }

        .app-shell {
            width: 100%;
            max-width: 600px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(51, 50, 46, 0.07);
            overflow: hidden;
        }

        .hero {
            background: linear-gradient(135deg, #244f32 0%, #376e3b 100%);
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .hero-main {
            min-width: 0;
        }

        .hero-badge-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: #d8f3c6;
            margin-bottom: 3px;
        }

        .hero h1 {
            font-size: 1.22rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .hero p {
            font-size: 0.84rem;
            opacity: 0.9;
            line-height: 1.35;
        }

        /* Kadrowanie logo: ukrywa górną część, zostawia awokado i wszystko niżej */
        .logo-crop-box {
            flex-shrink: 0;
            width: 78px;
            height: 78px;
            border-radius: 14px;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            position: relative;
        }

        .logo-crop-img {
            width: 78px;
            height: 98px;
            object-fit: cover;
            object-position: center bottom;
            transform: translateY(-20px);
            display: block;
        }

        .content {
            padding: 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: reveal 0.24s ease-out;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .intro-text {
            font-size: 0.96rem;
            color: var(--ink-main);
            margin-bottom: 14px;
        }

        .meta-line {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .meta-tag {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent-deep);
            background: var(--accent-soft);
            border: 1px solid #cce2d1;
            border-radius: 999px;
            padding: 4px 10px;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--ink-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .progress-track {
            width: 100%;
            height: 7px;
            background: var(--bg-soft);
            border: 1px solid var(--border-subtle);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 16px;
        }
